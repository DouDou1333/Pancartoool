<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pancartoool - TOTAL CONTROL OMEGA (LOGS)</title>
    <style>
        :root { --neon: #00ff41; --bg: #050505; --panel: #111; --danger: #ff0000; --gold: #ffff00; --blue: #00bfff; --apple: #ffffff; --auto: #00ffff; }
        body { margin: 0; padding: 10px; background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .status-bar { background: #002200; padding: 8px; border: 1px solid var(--neon); display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; }
        #console { flex-grow: 1; border: 1px solid var(--neon); background: #000; padding: 10px; overflow-y: auto; font-size: 0.7rem; margin-bottom: 8px; line-height: 1.2; word-break: break-all; }
        .log { border-left: 2px solid #222; padding-left: 5px; margin-bottom: 2px; }
        .success { color: var(--gold); } .err { color: var(--danger); font-weight: bold; } .info { color: var(--blue); } .nuke { color: #ff00ff; font-weight: bold; } .auto { color: var(--auto); font-weight: bold; }
        .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; overflow-y: auto; padding-bottom: 15px; }
        .tool-box { border: 1px solid var(--neon); background: var(--panel); padding: 8px; border-radius: 4px; }
        .tool-box h4 { margin: -8px -8px 8px -8px; font-size: 0.65rem; text-align: center; background: var(--neon); color: #000; padding: 3px; text-transform: uppercase; }
        button { background: rgba(0,255,65,0.05); color: var(--neon); border: 1px solid var(--neon); padding: 10px 2px; cursor: pointer; font-family: monospace; font-size: 0.65rem; font-weight: bold; width: 100%; margin-bottom: 4px; transition: 0.2s; }
        button:hover { background: var(--neon); color: #000; }
        .btn-nuke { border-color: #ff00ff; color: #ff00ff; border-width: 2px; } .btn-nuke:hover { background: #ff00ff; color: #000; }
        .btn-auto { border-color: var(--auto); color: var(--auto); background: rgba(0,255,255,0.1); border-width: 2px; } .btn-auto:hover { background: var(--auto); color: #000; }
        input { background: #000; border: 1px solid var(--neon); color: var(--neon); padding: 10px; width: 100%; box-sizing: border-box; font-size: 0.75rem; }
    </style>
</head>
<body>

    <div class="status-bar">
        <span>Pancartoool_LOG_MONITOR_OMEGA</span>
        <span id="devStatus" style="color: var(--danger);">IDLE</span>
    </div>

    <div id="console"></div>

    <div class="tool-grid">
        <div class="tool-box" style="grid-column: span 2;">
            <h4>🔌 SYNC MATÉRIELLE</h4>
            <div style="display: flex; gap: 5px;">
                <button onclick="connectDev('samsung')">⚡ SCAN SAMSUNG (S21 FE)</button>
                <button style="border-color:white; color:white;" onclick="connectDev('apple')"> SCAN APPLE (i13)</button>
            </div>
        </div>

        <div class="tool-box" style="grid-column: span 2; border-color: var(--auto);">
            <h4 style="background:var(--auto); color:#000;">🤖 SÉQUENCEUR AUTO-PILOT + MONITOR</h4>
            <button class="btn-auto" id="autoBtn" onclick="toggleAutoPilot()">▶️ LANCER INJECTION + LOGS (300ms)</button>
        </div>

        <div class="tool-box">
            <h4>⚙️ ACCÈS FORCÉ SYSTÈME</h4>
            <button onclick="inject('shell:am start -n com.android.settings/.Settings')">🔓 PARAMÈTRES</button>
            <button onclick="inject('shell:am start -a android.settings.WIFI_SETTINGS')">📶 WI-FI</button>
            <button class="btn-nuke" onclick="nukeSystem()">🔥 NUKE & HOME</button>
        </div>

        <div class="tool-box">
            <h4>🚀 ROOT & KG BYPASS</h4>
            <button onclick="inject('reboot bootloader')" style="color:var(--gold);">🚩 REBOOT ODIN</button>
            <button onclick="inject('shell:am start -a android.settings.DEVELOPMENT_SETTINGS')">🛠️ OPTIONS DEV</button>
            <button onclick="inject('shell:settings put global setup_wizard_has_run 1')">🔓 BYPASS SETUP</button>
            <button onclick="inject('shell:su -c \"setprop sys.boot_completed 1\"')">📟 ROOT BOOT COMPLETE</button>
            <button onclick="inject('shell:am start -a android.intent.action.VIEW -d \"https://google.com\"')">🌐 TEST WEB</button>
        </div>

        <div class="tool-box" style="grid-column: span 2;">
            <h4> iPHONE 13 ENGINE</h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;">
                <button style="color:white;" onclick="appleDiag('RECOVERY')">RECOVERY</button>
                <button style="color:white;" onclick="appleDiag('EXIT')">EXIT</button>
                <button style="color:white;" onclick="appleDiag('DFU')">DFU</button>
            </div>
            <button style="color:white;" onclick="appleDiag('IPSW')">IPSW RESTORE</button>
            <button style="color:white;" onclick="appleDiag('CHECKM8')">CHECKM8 EXPLOIT</button>
        </div>

        <div class="tool-box" style="grid-column: span 2;">
            <input type="text" id="manualCmd" placeholder="Injection binaire manuelle...">
            <button onclick="injectManual()" style="margin-top:5px;">EXECUTER</button>
        </div>
    </div>

    <script>
        const consoleEl = document.getElementById('console');
        const devStatus = document.getElementById('devStatus');
        let device = null, epOut = null, epIn = null, autoInterval = null, readLoop = null;

        function log(m, type='') {
            const d = document.createElement('div');
            d.className = `log ${type}`;
            d.innerHTML = `[${new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit', second: '2-digit'})}] ${m}`;
            consoleEl.appendChild(d); consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        async function connectDev(brand) {
            const vid = (brand === 'samsung') ? 0x04e8 : 0x05ac;
            try {
                device = await navigator.usb.requestDevice({ filters: [{ vendorId: vid }] });
                await device.open();
                await device.selectConfiguration(1);
                await device.claimInterface(0);
                const iface = device.configuration.interfaces[0].alternate;
                epOut = iface.endpoints.find(e => e.direction === 'out').endpointNumber;
                epIn = iface.endpoints.find(e => e.direction === 'in').endpointNumber;
                devStatus.textContent = brand.toUpperCase() + "_CONNECTED";
                devStatus.style.color = "#00ff41";
                log("SYNC OK. MONITORING ACTIVÉ.", "success");
                if (readLoop) clearInterval(readLoop);
                readLoop = setInterval(readLogs, 200); // Loop lecture logs auto
            } catch (e) { log("ERREUR SYNC : " + e.message, "err"); }
        }

        async function inject(cmd) {
            if (!device || !epOut) return log("ERREUR : Pas de device connecté !", "err");
            try {
                const data = new TextEncoder().encode(cmd + "\0");
                await device.transferOut(epOut, data);
                log("INJECTION : " + cmd, "info");
            } catch (e) { log("ERREUR INJECT : " + e.message, "err"); }
        }

        async function readLogs() {
            if (!device || !epIn) return;
            try {
                const result = await device.transferIn(epIn, 64);
                const decoder = new TextDecoder();
                const text = decoder.decode(result.data).replace(/[^\x20-\x7E]/g, '').trim();
                if (text) log("LOG : " + text, "auto");
            } catch (e) { log("ERREUR LOG : " + e.message, "err"); }
        }

        function toggleAutoPilot() {
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
                document.getElementById('autoBtn').innerHTML = "▶️ LANCER INJECTION + LOGS (300ms)";
                log("AUTO-PILOT STOP.", "info");
            } else {
                if (!device) { log("ERREUR : Connectez le S21 !", "err"); return; }
                log("AUTO-PILOT + MONITORING EN COURS...", "auto");
                document.getElementById('autoBtn').innerHTML = "⏹️ ARRÊTER";
                autoInterval = setInterval(async () => {
                    await inject('shell:am start -a android.intent.action.VIEW -d "https://google.com"');
                    await inject('shell:settings put global setup_wizard_has_run 1');
                    await inject('shell:input keyevent 3');
                    await readLogs();
                }, 300);
            }
        }

        async function nukeSystem() {
            log("NUKE EN COURS...", "nuke");
            await inject('shell:am kill-all');
            await inject('shell:input keyevent 3');
        }

        function appleDiag(type) { log("APPLE DIAG : " + type, "info"); }

        function injectManual() { const val = document.getElementById('manualCmd').value.trim(); if (val) inject(val); }
    </script>
</body>
</html>
